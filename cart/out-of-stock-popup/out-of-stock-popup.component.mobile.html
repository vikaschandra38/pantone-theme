<div class="coupon-overlay" [ngClass]="showPopup ? 'visible':''" (click)="closeMessagePopup()"></div>
<div class="coupon-main" [ngClass]="showPopup ? 'visible':''">
  <div class="coupon-inner">
    <div class="topbar">
      <h2>Information</h2>
      <a class="cross" (click)="closeMessagePopup()"><img src="../assets/images/close.png" /></a>
    </div>
   
    <div class="coupon-list">
      <li>
        <p>Some of the items are out of stock, kindly remove them from cart</p>
      </li>
    </div>
    <div class="applybtn-block">
      <a class="cancel" (click)="onReviseCart()" >{{btnText}}</a>
    </div>
  </div>
</div>
