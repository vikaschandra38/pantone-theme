<!-- {{addressList | json}} -->
<div class="checkoutsavedaddress">
    <div class="saveaddressheading">
        <h2>Where do you want us to deliver?</h2>
        <a (click)="addnewaddress()"><b>+</b> Add a New Address</a>
    </div>
    <mat-radio-group [formControl]="shippingAddressId" class="mat-gp">
        <mat-radio-button [value]="addresses" *ngFor="let addresses of addressList;let i=index" >
            <div class="list_inner">
                <div class="address">
                    <h3>{{addresses.name}} {{addresses.last_name}} <span
                            *ngIf="userInfo?.default_address_id == addresses?.add_id" class="default"> Default</span></h3>
                    <p class="address-field">{{addresses.address}},</p><p>{{addresses.city}}, {{addresses.pincode}} {{addresses.state}},
                    </p>
                    <p class="add-mobile">Mobile: <b>{{addresses.mobile}}</b></p>
                    <ul>
                        <li
                            *ngIf="pincodeData?.pincodeErrorMsg && ( shippingAddressId && shippingAddressId?.value?.add_id == addresses?.add_id)">
                            <img src="../../../assets/images/icon-cash.png" /> {{pincodeData?.pincodeErrorMsg}}</li>
                    </ul>
                    <!-- <p>{{addresses.cod}}</p> -->
                </div>
                <div class="editbtn">
                    <a class="remove" (click)="remove(addresses.add_id)">Remove</a>
                    <a class="edit" (click)="editaddressclick(addresses.add_id)">Edit</a>

                    <!-- <p class="location" *ngIf="addresses.address_type=='1'">Home</p>
                    <p class="location" *ngIf="addresses.address_type=='2'">Office</p> -->
                </div>
            </div>
        </mat-radio-button>
        <div class="blank_info mat-radio-button">
            <div class="list_inner_blank">
                <div data-action="add" class="addressBlocks-base-addBlock" (click)="addnewaddress()">
                    <div class="addressBlocks-base-addIcon">
                        <div class="addressBlocks-base-line1"></div>
                        <div class="addressBlocks-base-line2"></div>
                    </div>
                </div>
            </div>
        </div>
    </mat-radio-group>
