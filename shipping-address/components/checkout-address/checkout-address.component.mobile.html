<div *ngIf="userInfoLoading || userAddressRemoveLoading || pincodeDataLoading || cartInfoLoading ">

    <div class="loader-spinner loader">
        <mat-spinner [diameter]="30" [strokeWidth]="3" class="centre-align"></mat-spinner>
    </div>
</div>

<div class="empty-cart" *ngIf="(cartInfo?.items?.length === 0 || !cartInfo?.items) && cartInfoLoaded">
    <img src="../assets/images/cart-empty.png" width="120" />
    <h2>Hey, it feels so light!</h2>
    <p>There is nothing in your bag. Let’s add some items.</p>
    <a routerLink="/" class="shopnow">Shop Now</a>
</div>
<div class="userInfo" *ngIf="userInfoLoaded && cartInfoLoaded && !(cartInfo?.items?.length === 0 || !cartInfo?.items)"
    [ngClass]="(!addressList?.length || openAddressForm ? 'add-address' : '') + ' ' + (addressList?.length && !openAddressForm ? 'address-list' : '')">
    <div class="checkout-address">
        <app-checkout-address-form *ngIf="!addressList?.length || openAddressForm" [addressList]="addressList"
            [userEditAddressSaveLoading]="userEditAddressSaveLoading" [userAddressSaveLoading]="userAddressSaveLoading" [editData]="editData"
            [userAddressSaveLoaded]="userAddressSaveLoading|async" [saveType]="formType"
            [userAddressSaveFailure]="userAddressSaveFailure|async" (updateCart)="updatingCartAddress($event)"
            (saveAddress)="saveShippingAddress($event)" (editAddress)="editAddress($event)" [userInfo]="userInformation"
            (showAddressForm)="showAddressForm($event)">
        </app-checkout-address-form>
    </div>
    <div class="shippping-address">
        <app-shipping-address-list *ngIf="addressList?.length && !openAddressForm" [addressList]="addressList"
            [shippingLoading]="shippingLoading" [shippingLoaded]="shippingLoaded"
            [shippingUpdateFailure]="shippingUpdateFailure" (editAddressData)="getEditAddressData($event)"
            (showAddressForm)="showAddressForm($event)" [userInfo]="userInformation"
            (isPincodeServiceable)="isPincodeServiceable($event)" (removedAddressData)="removeAddress($event)"
            (checkFormType)="checkFormType($event)" (shippingDetails)="continueShipping($event) " [cartInfo]="cartInfo">
        </app-shipping-address-list>
    </div>
    <div class="purchase-summary" *ngIf="mobile">
        <app-purchase-summary [cartInfo]="cartInfo" [shippingLoading]="shippingLoading"
            [shippingLoaded]="shippingLoaded" (addressSelected)="continueShipping($event)"></app-purchase-summary>
        <span *ngIf="shippingUpdateFailure" class="shippingUpdateFailure">Could not update Shipping Information.</span>
    </div>
</div>
