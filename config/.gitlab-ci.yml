image: node:latest
# testing
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/

variables:
  folder_name: ${GITLAB_PANTONE_THEME_REPO}
  branch_name: ${CI_COMMIT_REF_NAME}

before_script:
  - apt-get update
  - apt-get install -y gconf-service libasound2 libatk1.0-0 libc6 libcairo2 libcups2 libdbus-1-3 libexpat1 libfontconfig1 libgcc1 libgconf-2-4 libgdk-pixbuf2.0-0 libglib2.0-0 libgtk-3-0 libnspr4 libpango-1.0-0 libpangocairo-1.0-0 libstdc++6 libx11-6 libx11-xcb1 libxcb1 libxcomposite1 libxcursor1 libxdamage1 libxext6 libxfixes3 libxi6 libxrandr2 libxrender1 libxss1 libxtst6 ca-certificates fonts-liberation libappindicator1 libnss3 lsb-release xdg-utils wget
stages:
  - buildSubModuleDeploy

## Creating CSR Build in case of staging commits or merge

sub_module_deploy:
  stage: buildSubModuleDeploy
  only:
    - tags
    - staging
    - BB/feature/EECW-770

  script:
    - echo $CI_COMMIT_REF_NAME
    - if [ $CI_COMMIT_REF_NAME != "staging" ]; then branch_name="master"; fi
    - echo $branch_name
    - cd src/app/themes/
    - git clone https://${GITLAB_PANTONE_THEME_USERNAME}:${GITLAB_PANTONE_THEME_TOKEN}@gitlab.com/eshopbox-team/${folder_name}.git
    - cd ${folder_name} && git checkout $branch_name && cd ..
    - pwd
    - cd ../../..
    - ln -s -fn src/app/themes/${folder_name}/config/package.json package.json
    - ln -s -fn src/app/themes/${folder_name}/config/tsconfig.json tsconfig.json
    - ln -s -fn src/app/themes/${folder_name}/config/angular.json angular.json
    - ln -s -fn src/app/themes/${folder_name}/config/firebase.json firebase.json
    - ln -s -fn src/app/themes/${folder_name}/config/.firebaserc .firebaserc
    - cd src
    - ln -s -fn app/themes/${folder_name}/config/src/environments environments
    - ln -s -fn app/themes/${folder_name}/config/src/tsconfig.server.json tsconfig.server.json
    - ln -s -fn app/themes/${folder_name}/config/src/manifest.json manifest.json
    - ln -s -fn app/themes/${folder_name}/config/src/tsconfig.app-ssr.json tsconfig.app-ssr.json
    - ln -s -fn app/themes/${folder_name}/config/src/tsconfig.app.json tsconfig.app.json
    - rm -rf environments && cp -r app/themes/${folder_name}/config/src/environments environments
    - cd ..
    - npm install --silent

    - if [ $branch_name == "master" ]; then
      node_modules/.bin/ng build --prod --configuration=production --aot=true --build-optimizer=true --extract-css=false --vendor-chunk=true --common-chunk=true --progress=true --delete-output-path=true --named-chunks=true --show-circular-dependencies=true --optimization=true && node_modules/.bin/ng run EshopBoxStore:mobile --configuration=mobprod && node_modules/.bin/ng run EshopBoxStore:server-web -c production && node_modules/.bin/ng run EshopBoxStore:server-mobile -c mobprod  && npm run webpack:server;
      else
      node --max_old_space_size=4096 node_modules/@angular/cli/bin/ng build --aot=true --build-optimizer=true --extract-css=false --vendor-chunk=true --common-chunk=true --progress=true --delete-output-path=true --named-chunks=true --show-circular-dependencies=true --optimization=true && node_modules/.bin/ng run EshopBoxStore:mobile --configuration=mob && node_modules/.bin/ng run EshopBoxStore:server-web  && node_modules/.bin/ng run EshopBoxStore:server-mobile -c mob  && npm run webpack:server;
      fi
    - cd functions && npm install --silent  && npm run build && cd .. && ls -la
    - if [ $branch_name == "master" ]; then
      node_modules/firebase-tools/lib/bin/firebase.js use prod --token $GITLAB_FIREBASE_TOKEN  && node_modules/firebase-tools/lib/bin/firebase.js deploy  --token $GITLAB_FIREBASE_TOKEN --non-interactive;
      else
      node_modules/firebase-tools/lib/bin/firebase.js use staging --token $GITLAB_FIREBASE_TOKEN  && node_modules/firebase-tools/lib/bin/firebase.js deploy   --token $GITLAB_FIREBASE_TOKEN --non-interactive;
      fi

    - cd src && rm -rf environments && ln -s -fn  app/themes/${folder_name}/config/src/environments environments && cd ..
