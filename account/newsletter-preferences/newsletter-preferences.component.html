<div class="primary_box" id="newsletter">
    <div class="newsletter_inner">
        <h3>Subscribe to our email newsletter to be the first to receive Duke India news, promotions and offers.
            To subscribe to category, click an image below:</h3>
        <ul>
            <li (click)="newslettermen()" [ngClass]="men ? 'active' : ''">
                <img src="assets/duke-assets/images/Mens-shop.png" alt="" />
            </li>
            <li (click)="newsletterwomen()" [ngClass]="women ? 'active' : ''">
                <img src="assets/duke-assets/images/shop-shoes.png" alt="" />
            </li>
            <!-- <li (click)="newsletterkids()" [ngClass]="kids ? 'active' : ''">
                <img src="../../../../../../assets//duke-assets/images/newsletter-kids.jpg" alt="" />
            </li> -->
        </ul>   
        
        <div class="newlettersubmit">
            <a (click)="Selectall()">Select All</a>
            <a>Join Duke India</a>
        </div>
    </div>
</div><!-- newsletter block div -->
