<section class="contact-page">
    <div class="container">
        <div class="contact-wrp">
            <div class="heading">

                <h1> Customer Service </h1>
            </div>
            <div class="col-1">
                <div class="box-heading">
                    <!-- <h3> {{contactusdata?.addComponents[0]?.fields?.displayMainText}} </h3> -->
                    <!-- <p> {{contactusdata?.pageElements[0]?.fields?.description}} </p>  -->
                </div>
                <div class="toggle-box">
                    <h3 class="toggle-heading" (click)="telclick()" [ngClass]="telnumber ? 'active':'in-active'"> <img src="../../assets/images/tel-icon.png" /> {{contactusdata?.addComponents[0]?.fields?.relatedContent[0]?.fields?.displayMainText}} </h3>
                    <div class="toggle-info" [ngClass]="telnumber ? 'active':'in-active'">
                        <p>
                            <a href='tel:{{contactusdata?.addComponents[0]?.fields?.relatedContent[0]?.fields?.description}}' [innerHTML]="contactusdata?.addComponents[0]?.fields?.relatedContent[0]?.fields?.description"></a>
                        </p>
                    </div>
                </div>
                <div class="toggle-box">
                    <h3 class="toggle-heading" (click)="emailclick()" [ngClass]="showemail ? 'active':'in-active'"> <img src="../../assets/images/mail-icon.png" /> {{contactusdata?.addComponents[0]?.fields?.relatedContent[1]?.fields?.displayMainText}} </h3>
                    <div class="toggle-info" [ngClass]="showemail ? 'active':'in-active'">
                        <p>
                            <a href="mailto:{{contactusdata?.addComponents[0]?.fields.relatedContent[1]?.fields?.description}}" [innerHTML]="contactusdata?.addComponents[0]?.fields?.relatedContent[1]?.fields?.description"></a>
                        </p>
                    </div>
                </div>
                <div class="toggle-box">
                    <h3 class="toggle-heading" (click)="addressclick()" [ngClass]="showaddress ? 'active':'in-active'"> <img src="../../assets/images/address-icon.png" /> {{contactusdata?.addComponents[0]?.fields?.relatedContent[2]?.fields?.displayMainText}} </h3>
                    <div class="toggle-info" [ngClass]="showaddress ? 'active':'in-active'">
                        <p [innerHTML]="contactusdata?.addComponents[0]?.fields.relatedContent[2]?.fields?.description"> </p>

                    </div>
                </div>
            </div>
