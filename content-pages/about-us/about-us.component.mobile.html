<div class="carousel-inner" align="center" role="listbox">
  <div class="carousel-item" >
      <div class="col-md-12">
          <mat-card >              
              
                  <img mat-card-image [src]="aboutusdata?.addComponents[0]?.fields?.addComponents[0]?.fields?.desktopImage[0]?.fields?.file?.url" 
                  alt="Photo of a Shiba Inu">
                  <mat-card-content>
                    <div class="card-body">
                        <!-- <h3 class="card-title">Our History</h3> -->
                        <p  [innerHTML]="(aboutusdata?.addComponents[0]?.fields?.addComponents[1]?.fields?.description )" style="text-align: justify;color: black;font-family:'Lato', sans-serif;font-size: 13px;letter-spacing: 0.5px;">{{ aboutusdata?.addComponents[0]?.fields?.addComponents[0]?.fields?.description }}</p>

                    </div>
                </mat-card-content>

          </mat-card>
      </div>


  </div>

</div>


<ul class="recentproduct" style="padding-top: 50px;">

  <owl-carousel #owlElement
  [options]="{items: 2, dots: true, nav: true, loop:false, autoplay: false, autoplayTimeout:5000, autoplayHoverPause:false}"
  [items]="aboutusdataCa1" [carouselClasses]="['owl-theme', 'sliding' ]">
    <div class="item" *ngFor="let about of aboutusdataCa1;let $index=index; ">
      <li [lazy-load-images]="{ rootMargin: '10px' }">
        <a>
          <div class="img">
            <img class=""   [src]="about?.fields?.addComponents[0]?.fields?.desktopImage[0]?.fields?.file?.url"  />
                       
          </div>
          <div class="pro_bottom">
            <div class="titleblock">
              <h3 style="font-family:'Lato', sans-serif">{{ about?.fields?.addComponents[1]?.fields.displayMainText }}</h3>
            </div>
            <div >
              <p  [innerHTML]="(about?.fields?.addComponents[1]?.fields?.description )" style="text-align: justify;color: black;font-family:'Lato', sans-serif;font-size: 13px;">{{ about?.fields?.addComponents[1]?.fields?.description }}</p>
              <div class="titleblock"  style="text-align: justify">
                  <!-- <p>➡Learn More</p> -->
                </div>  
              </div>
            <!-- <div class="titleblock">
              <p>➡Learn More</p>
            </div> -->
            
          </div>
        </a>
      </li>
    </div>
  </owl-carousel>
</ul>



<div class="carousel-inner" align="center" role="listbox">
  <div class="carousel-item" style="display: block; width: 100%;">
      <div class="col-md-12">
          <mat-card class="example-card">
              <mat-card-content>
                  <div class="card-body">
                      <h3 class="card-title">Our History</h3><br>
                  </div>
              </mat-card-content>
              <img mat-card-image [src]="aboutusdata?.addComponents[5]?.fields?.addComponents[0]?.fields?.desktopImage[0]?.fields?.file?.url"
                  alt="Photo of a Shiba Inu">

          </mat-card>
      </div>


  </div>

</div>
</div>
