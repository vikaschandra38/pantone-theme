<!-- {{ formalsaw | json }} -->
<section class="page">
    <div class="loader" *ngIf="!formalsaw">
      <mat-spinner [diameter]="30" [strokeWidth]="3" class="centre-align"></mat-spinner>
    </div>
    <div class="blockmain" *ngIf = "formalsaw">
      <!-- <h1>{{ formalsaw?.pageTitle }}</h1> -->
      <div class="block" *ngFor="let formalsawlist of formalsaw?.pageElements" >
        <div class="img_block" *ngIf="formalsawlist && formalsawlist?.fields && formalsawlist?.fields?.desktopImagesvideo && formalsawlist?.fields?.desktopImagesvideo[0] && formalsawlist?.fields?.desktopImagesvideo[0]?.fields && formalsawlist?.fields?.desktopImagesvideo[0]?.fields && formalsawlist?.fields?.desktopImagesvideo[0]?.fields?.file && formalsawlist?.fields?.desktopImagesvideo[0]?.fields?.file?.url">
            <img [src]="formalsawlist?.fields?.desktopImagesvideo[0]?.fields?.file?.url" />
        </div>  
      </div>

      <div class="ftlinks">
        <a routerLink="/" class="text-center">www.Pantone.com</a><br />
        <div class="sociallink">
          <a href="https://www.facebook.com/PantoneMenswear/" target="_blank"><img src="../../assets/images/fb.png" />Pantonemenswear</a>
          <a href="https://twitter.com/Pantonemens" target="_blank"><img src="../../assets/images/tt.png" />Pantonemens</a>
          <a href="https://www.instagram.com/Pantonemenswear/" target="_blank"><img src="../../assets/images/ins.png" />Pantonemens</a>
          <a href="mailto:customersupport@Pantone.com">| customersupport@Pantone.com</a>
        </div>
    </div>
    </div>
</section>
