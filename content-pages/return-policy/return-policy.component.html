<!-- {{ returnpolicy | json }} -->
<section class="page">
    <div class="container">
      <div class="flexblock">
        <div class="sidebar">
          <content-sidebar></content-sidebar>
        </div>
        <div class="loader" *ngIf = "!returnpolicy"></div>
        <div class="rightbar" *ngIf = "returnpolicy">
            <div class="accordion" >
                <h1>{{ returnpolicy?.pageTitle }}</h1>
  
                <mat-accordion>
                    <mat-expansion-panel *ngFor="let privacy of returnpolicy?.pageElements; let isFirst = first" [expanded]="isFirst">
                      <mat-expansion-panel-header>
                        <mat-panel-title>
                            <h4 [innerHTML]="( privacy?.fields?.displayMainText )">{{ privacy?.fields?.displayMainText }}</h4>
                        </mat-panel-title>
                      </mat-expansion-panel-header>
                      <p [innerHTML]="( privacy?.fields?.description )">{{ privacy?.fields?.description }}</p>
                    
                    </mat-expansion-panel>
                  </mat-accordion>
  
            </div>
        </div>
      </div>
    </div>
  </section>
